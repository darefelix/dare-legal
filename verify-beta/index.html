<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-src 'none'">
  <title>Continue in DARE. · Beta</title>
  <script src="verify.js"></script>
  <link rel="stylesheet" href="verify.css">
</head>
<body>
  <main aria-labelledby="heading">
    <p class="brand">DARE<span>.</span></p>
    <p class="eyebrow">TESTFLIGHT BETA</p>
    <div role="status" aria-live="polite" aria-atomic="true">
      <h1 id="heading">Verify your email</h1>
      <p id="message">Use the confirmation link in your DARE. email, then return to the app and sign in.</p>
    </div>
    <a id="open-app" href="dare://home" referrerpolicy="no-referrer">Open DARE.</a>
    <p id="fallback">Requires the DARE. beta installed from TestFlight. If nothing opens, open DARE. manually and sign in. DARE Staging is a separate development app.</p>
    <noscript><p>JavaScript is required to remove confirmation details from the address bar. Close this tab and open DARE. manually. Do not share this link.</p></noscript>
  </main>
</body>
</html>
